global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "Prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "Tenable.SC"
    static_configs:
      - targets: ["<Tenable.SC IP>:9090"]

  - job_name: "Tenable Manager"
    static_configs:
      - targets: ["<Tenable Manager IP>:9090"]

  - job_name: "Tenable NNM"
    static_configs:
      - targets: ["<Tenable NNM IP>:9090"]
